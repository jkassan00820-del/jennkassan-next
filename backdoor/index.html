<style>
:root{--bg:#F8F4EC;--surface:#ffffff;--fg:#333333;--muted:#6b665c;--line:#E8DDC8;--forest:#214534;--gold:#C89D4A;--gold-soft:#f3ead6;
  --good:#2f6e47;--warn:#a06a14;--bad:#a3352b;--on-forest:#F8F4EC;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Libre Baskerville",Georgia,serif;--ui:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151b17;--surface:#1e2621;--fg:#ece7dc;--muted:#a59f92;--line:#34403a;--forest:#214534;--gold:#d6ae5e;--gold-soft:#3a3222;
  --good:#6cc08d;--warn:#e0a94a;--bad:#e2766b;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
[hidden]{display:none!important}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--ui);font-variant-numeric:tabular-nums}
.lock{min-height:85vh;display:grid;place-items:center}
.lockbox{width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.lockbox h1{font-family:var(--display);font-weight:600;font-size:2rem;margin:0}
.lockbox .eb{font-family:var(--ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.dots{display:flex;gap:12px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--forest);display:block}
.dots i.f{background:var(--forest)}
@media (prefers-color-scheme:dark){.dots i{border-color:var(--gold)}.dots i.f{background:var(--gold)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 1.4rem var(--ui)}
.pad button.t{border:none;background:transparent;font-size:.85rem;color:var(--muted)}
.msg{font-family:var(--ui);min-height:1.3em;margin:0;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.homelink{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:var(--ui);font-size:.9rem;color:var(--muted);text-decoration:none;padding:6px 2px}
.homelink:hover,.homelink:focus-visible{color:var(--fg);text-decoration:underline}
</style>
</head>

(function(){
const $=id=>document.getElementById(id);
let entry="",busy=false;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function dots(){$("dots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<entry.length?"f":""}"></i>`).join("")}
$("pad").innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")+
  `<button type="button" class="t" data-k="c">Clear</button><button type="button" data-k="0">0</button><button type="button" class="t" data-k="b">Delete</button>`;
function press(k){if(busy)return;$("msg").textContent="";$("msg").className="msg";
  if(k==="c")entry="";else if(k==="b")entry=entry.slice(0,-1);else if(entry.length<4)entry+=k;
  dots();if(entry.length===4)open()}
$("pad").addEventListener("click",e=>{const k=e.target.dataset.k;if(k)press(k)});
document.addEventListener("keydown",e=>{if(!$("app").hidden)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("b")});
async function open(){
  busy=true;$("msg").textContent="Unlocking…";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(entry),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(VAULT.s),iterations:VAULT.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(VAULT.i)},key,b64(VAULT.d));
    var payload=JSON.parse(new TextDecoder().decode(plain));
  }catch(e){
    $("msg").textContent="That PIN doesn't match.";$("msg").className="msg err";entry="";dots();busy=false;return;
  }
  entry="";
  $("lock").hidden=true;$("homeLink").hidden=true;$("app").hidden=false;$("app").innerHTML=payload.html;
  document.title="FIO Back Office";
  try{new Function(payload.js)()}catch(e){$("app").insertAdjacentHTML("afterbegin",'<p class="msg err" style="padding:12px">Something went wrong loading the page: '+String(e&&e.message||e).replace(/</g,"&lt;")+'</p>')}
  busy=false;
}
dots();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{})}
})();
</script>
